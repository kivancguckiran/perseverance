name: persistent-wp30-local

x-local-labels: &local-labels
  persistent.wp30.local: 'true'

x-fixture: &fixture
  image: node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
  restart: unless-stopped
  labels: *local-labels
  env_file: ../../.wp30/local.env
  volumes:
    - ./fixture-server.mjs:/opt/wp30/fixture-server.mjs:ro
  command: ['node', '/opt/wp30/fixture-server.mjs']
  networks: [wp30-local]

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    labels: *local-labels
    environment:
      POSTGRES_DB: wp30_local
      POSTGRES_USER: wp30_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ['127.0.0.1:55430:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-wp30-local.sql:ro
      - ../postgres/migrations/0034_wp30_production_rollout.sql:/docker-entrypoint-initdb.d/34-wp30-rollout.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wp30_admin -d wp30_local']
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [wp30-local]

  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    labels: *local-labels
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [wp30-local]

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    labels: *local-labels
    env_file: ../../.wp30/local.env
    command: ['server', '/data', '--console-address', ':9001']
    ports: ['127.0.0.1:59000:9000']
    volumes: [object-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/ready']
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [wp30-local]

  workspace-agent:
    <<: *fixture
    environment:
      WP30_LOCAL_ROLE: workspace-agent
      PORT: '3302'
    ports: ['127.0.0.1:3302:3302']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3302/readyz']
      interval: 2s
      timeout: 3s
      retries: 60

  control-plane:
    <<: *fixture
    environment:
      WP30_LOCAL_ROLE: control-plane
      PORT: '3300'
    ports: ['127.0.0.1:3300:3300']
    depends_on:
      postgres: { condition: service_healthy }
      cache: { condition: service_healthy }
      object-storage: { condition: service_healthy }
      workspace-agent: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3300/readyz']
      interval: 2s
      timeout: 3s
      retries: 60

  web:
    <<: *fixture
    environment:
      WP30_LOCAL_ROLE: web
      PORT: '3301'
    ports: ['127.0.0.1:3301:3301']
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3301/readyz']
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
    labels: *local-labels
  object-data:
    labels: *local-labels

networks:
  wp30-local:
    name: persistent-wp30-local
    labels: *local-labels

secrets:
  postgres_password:
    file: ../../.wp30/postgres-password
