receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  filter/telemetry_boundary:
    error_mode: propagate
    traces:
      span:
        - 'attributes["prompt"] != nil or attributes["output"] != nil or attributes["content"] != nil or attributes["authorization"] != nil'
  batch: { timeout: 1s, send_batch_size: 512 }
exporters:
  debug: { verbosity: basic }
  prometheus: { endpoint: 0.0.0.0:9464 }
extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
service:
  extensions: [health_check]
  pipelines:
    traces:
      {
        receivers: [otlp],
        processors: [memory_limiter, filter/telemetry_boundary, batch],
        exporters: [debug],
      }
    metrics:
      {
        receivers: [otlp],
        processors: [memory_limiter, batch],
        exporters: [prometheus, debug],
      }
    logs:
      {
        receivers: [otlp],
        processors: [memory_limiter, batch],
        exporters: [debug],
      }
