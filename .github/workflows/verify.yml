name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install PDF parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils util-linux
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Public release preflight
        run: pnpm release:public-preflight
        env:
          PUBLIC_PREFLIGHT_SKIP_CLEAN_CHECKOUT: '1'
